# This file was updated from the old "v1" of golangci-lint config
# to the new "v2" format using `golangci-lint migrate`.

version: "2"

run:
  # Pelican is large enough that GitHub Actions sometimes time out
  # on a cold cache.
  timeout: 5m

  # The client-only and server-only commands live behind build tags,
  # so an untagged run silently skips all of the "cmd" package.
  # Linting both tags at once keeps whole-program linters, such as "unused",
  # from flagging helpers that only the other tag calls.
  build-tags:
    - client
    - server

linters:
  enable:
    - forbidigo
    - misspell
  disable:
    - staticcheck
  settings:
    forbidigo:
      # Match against the resolved package, so a local variable named "os"
      # cannot trip the rule and a dot-import cannot slip past it.
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          pkg: ^os$
          msg: >-
            os.Exit runs no defers, so the asynchronous log writer never drains
            and the line explaining the exit is lost -- the process dies
            silently. Use exitWithError/exitWithErrorf to report a fatal error,
            or exitWithFlush when the message has already been reported.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - reference$
    rules:
      # The os.Exit ban is about the CLI's log-writer drain, so it applies only
      # to the command package. The one sanctioned call, inside exitWithFlush
      # itself, carries a //nolint:forbidigo directive.
      - linters: [forbidigo]
        path-except: ^cmd/
      # A test binary's own exit does not go through the CLI's shutdown path.
      - linters: [forbidigo]
        path: _test\.go$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pelicanplatform/pelican
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - reference$
