# Standalone GoReleaser config for the libLotMan C-ABI shared library.
#
# This is intentionally separate from .goreleaser.in.yml so the main
# pelican / pelican-server builds stay CGO-free. -buildmode=c-shared requires
# CGO and a per-target C toolchain, so it must be built on a native runner per
# architecture rather than cross-compiled.
#
# NOTE: no release-CI job runs this config yet -- it is invoked by hand via
# `make lotman-package`, which generates .goreleaser.lotman.generated.yml with
# scripts/generate_goreleaser.sh.
#
# KNOWN GAPS, to close before this is wired into a release:
#   - `bindir` below applies to every format, so the deb and apk builds also put
#     the library in /usr/lib64, which is not on the library search path on
#     Debian or Alpine. Those formats need their own nfpm entry.
#   - `make lotman-package` is hardcoded to --snapshot and this template has no
#     version placeholder, so generate_goreleaser.sh substitutes nothing and the
#     packages get a snapshot version rather than a release one.
#   - The three goarch values below all build with CGO_ENABLED=1 in one run,
#     which needs a cross C toolchain per target; in practice each architecture
#     has to be built on a native runner.
#   - No `replaces`/Obsoletes, so there is no upgrade path from the upstream
#     `lotman` package -- only the file-conflict refusal that `conflicts` gives.
version: 2
project_name: pelican-lotman

before:
  hooks:
    - go mod tidy

builds:
  - id: lotman-shared
    main: ./lotman/cshared
    binary: libLotMan.so
    buildmode: c-shared
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
    # No build tags: this ships the current (v0.1.0) C ABI. The Makefile's
    # LOTMAN_ABI auto-detection is for local builds against whatever
    # xrootd-lotman is installed on the box; a package has to pick one, and a
    # legacy-ABI package would be a separate build with
    # `-tags lotman_legacy_api` and its own package name. Shipping the wrong one
    # is not a soft failure: the argument lists differ, so a mismatched plugin
    # faults on its first purge tick.
    tags: []
    # The C ABI version is reported at runtime by lotman_version(); no Go
    # version metadata is linked into the library.
    ldflags:
      - -s -w

archives:
  - id: lotman-shared
    ids:
      - lotman-shared
    name_template: >-
      libLotMan_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    # Ship the generated C header alongside the library so consumers can compile
    # against it.
    files:
      - LICENSE
      - src: "dist/lotman-shared_{{ .Os }}_{{ .Arch }}*/libLotMan.h"
        dst: include/lotman/lotman.h

nfpms:
  - id: lotman
    package_name: pelican-lotman
    ids:
      - lotman-shared
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: OSG Consortium
    homepage: https://pelicanplatform.org
    maintainer: Pelican Team <help@pelicanplatform.org>
    description: |-
      LotMan storage-lot management shared library (libLotMan, C ABI), built from
      Pelican's native Go lot engine. A drop-in for external C consumers such as
      the XRootD pfc purge plugin.
    license: ASL 2.0
    formats:
      - apk
      - deb
      - rpm
    release: 1
    # This package installs /usr/lib64/libLotMan.so and
    # /usr/include/lotman/lotman.h, both owned by the upstream `lotman` package
    # it is a drop-in for. Without declaring that, installing it on a host that
    # already has xrootd-lotman's dependency fails with a file conflict rather
    # than replacing it.
    #
    # The Provides is versioned at the C ABI level, not at Pelican's version:
    # xrootd-lotman.spec carries `Requires: lotman >= 0.1.0` and
    # `lotman < 0.2.0`, and an unversioned `Provides: lotman` does not satisfy a
    # versioned dependency in RPM. What this library implements is the lotman
    # v0.1.x C ABI, so that is what it claims; bump it when the exported ABI
    # changes, independently of Pelican's own version.
    provides:
      - "lotman = 0.1.0"
    conflicts:
      - lotman
    # KNOWN GAP: Go's -buildmode=c-shared emits no DT_SONAME (the linker
    # invocation adds -shared, -Wl,-z,nodelete and -Wl,-Bsymbolic, never
    # -Wl,-soname). If libXrdPurgeLotMan.so records a versioned DT_NEEDED such
    # as libLotMan.so.0, this file cannot satisfy it. Setting an soname via
    # -extldflags has not been validated against a real plugin build, so it is
    # deliberately not attempted here.
    # Place the shared library under the system library directory rather than the
    # default /usr/bin.
    bindir: /usr/lib64
    contents:
      # cgo names the generated header after the package directory. Upstream
      # lotman installs its header at %{_includedir}/lotman/lotman.h and
      # xrootd-lotman compiles `#include <lotman/lotman.h>`
      # (src/XrdPurgeLotMan.cc), so a drop-in has to land in that subdirectory
      # under that name -- not at the include root.
      - src: "dist/lotman-shared_{{ .Os }}_{{ .Arch }}*/libLotMan.h"
        dst: "/usr/include/lotman/lotman.h"
        file_info:
          mode: 0644
      - src: LICENSE
        dst: "/usr/share/doc/{{ .PackageName }}-{{ .Version }}/LICENSE.txt"
        file_info:
          mode: 0644
        type: doc
