# Standalone GoReleaser config for the libLotMan C-ABI shared library.
#
# This is intentionally separate from .goreleaser.in.yml so the main
# pelican / pelican-server builds stay CGO-free. -buildmode=c-shared requires
# CGO and a per-target C toolchain, so it must be built on a native runner per
# architecture rather than cross-compiled.
#
# NOTE: no release-CI job runs this config yet -- it is invoked by hand via
# `make lotman-package`, which generates .goreleaser.lotman.generated.yml with
# scripts/generate_goreleaser.sh.
version: 2
project_name: pelican-lotman

before:
  hooks:
    - go mod tidy

builds:
  - id: lotman-shared
    main: ./lotman/cshared
    binary: libLotMan.so
    buildmode: c-shared
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
    # No build tags: this ships the current (v0.1.0) C ABI. The Makefile's
    # LOTMAN_ABI auto-detection is for local builds against whatever
    # xrootd-lotman is installed on the box; a package has to pick one, and a
    # legacy-ABI package would be a separate build with
    # `-tags lotman_legacy_api` and its own package name. Shipping the wrong one
    # is not a soft failure: the argument lists differ, so a mismatched plugin
    # faults on its first purge tick.
    tags: []
    # The C ABI version is reported at runtime by lotman_version(); no Go
    # version metadata is linked into the library.
    ldflags:
      - -s -w

archives:
  - id: lotman-shared
    ids:
      - lotman-shared
    name_template: >-
      libLotMan_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    # Ship the generated C header alongside the library so consumers can compile
    # against it.
    files:
      - LICENSE
      - src: "dist/lotman-shared_{{ .Os }}_{{ .Arch }}*/libLotMan.h"
        dst: include
        strip_parent: true

nfpms:
  - id: lotman
    package_name: pelican-lotman
    ids:
      - lotman-shared
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: OSG Consortium
    homepage: https://pelicanplatform.org
    maintainer: Pelican Team <help@pelicanplatform.org>
    description: |-
      LotMan storage-lot management shared library (libLotMan, C ABI), built from
      Pelican's native Go lot engine. A drop-in for external C consumers such as
      the XRootD pfc purge plugin.
    license: ASL 2.0
    formats:
      - apk
      - deb
      - rpm
    release: 1
    # This package installs /usr/lib64/libLotMan.so and /usr/include/lotman.h,
    # both owned by the upstream `lotman` package it is a drop-in for. Without
    # declaring that, installing it on a host that already has xrootd-lotman's
    # dependency fails with a file conflict rather than replacing it.
    provides:
      - lotman
    conflicts:
      - lotman
    # KNOWN GAP: Go's -buildmode=c-shared emits no DT_SONAME (the linker
    # invocation adds -shared, -Wl,-z,nodelete and -Wl,-Bsymbolic, never
    # -Wl,-soname). If libXrdPurgeLotMan.so records a versioned DT_NEEDED such
    # as libLotMan.so.0, this file cannot satisfy it. Setting an soname via
    # -extldflags has not been validated against a real plugin build, so it is
    # deliberately not attempted here.
    # Place the shared library under the system library directory rather than the
    # default /usr/bin.
    bindir: /usr/lib64
    contents:
      # cgo names the generated header after the package directory, but every
      # consumer does #include "lotman.h", matching the upstream library this
      # replaces. Install it under the name they expect.
      - src: "dist/lotman-shared_{{ .Os }}_{{ .Arch }}*/libLotMan.h"
        dst: "/usr/include/lotman.h"
        file_info:
          mode: 0644
      - src: LICENSE
        dst: "/usr/share/doc/{{ .PackageName }}-{{ .Version }}/LICENSE.txt"
        file_info:
          mode: 0644
        type: doc
