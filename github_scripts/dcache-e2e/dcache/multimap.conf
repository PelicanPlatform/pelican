# Token subjects (sub@<provider alias>) to dCache users.
#  pelican-cache:    the cache's identity; root /, owns /data/pelican.
#  pelican-renewed:  the same uid under another name, so a test can tell
#                    from a macaroon's id: caveat which of two tokens the
#                    cache presented for it.
#  pelican-chroot:   a user whose storage-authzdb root is /data/chroot, to
#                    see how a chrooted user's macaroons are scoped.
oidc:pelican-cache@pelican    username:pelican        uid:1000 gid:1000,true
oidc:pelican-renewed@pelican  username:pelicanrenewed uid:1000 gid:1000,true
oidc:pelican-chroot@pelican   username:pelicanchroot  uid:1001 gid:1001,true
