# dcache.conf for the single-node dCache that Pelican's dCache tiering
# end-to-end test runs against.  See ../run.sh.
dcache.layout = pelican-e2e

# One JVM (domain) runs every service, so no message broker is needed.
dcache.broker.scheme = none
dcache.zookeeper.connection = localhost:2181

dcache.enable.space-reservation = false
dcache.enable.overwrite = true
cleaner-disk.destination.remove-notification =

dcache.db.host = postgres
dcache.db.user = dcache
dcache.db.password = let-me-in
chimera.db.name = chimera
chimerashell.db.host = ${chimera.db.host}
chimerashell.db.user = ${chimera.db.user}
chimerashell.db.password = ${chimera.db.password}
chimerashell.db.name = ${chimera.db.name}

# The throwaway CA has no IGTF signing policy or CRL; neither matters,
# because no client presents an X.509 certificate.
dcache.authn.namespace-mode = IGNORE
dcache.authn.crl-mode = IGNORE
