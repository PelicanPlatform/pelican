# Layout of the single-node dCache for Pelican's dCache tiering end-to-end
# test.  @ISSUER_URL@ is filled in by run.sh.
# The address pools put in the URLs the door redirects clients to is set
# with -Dorg.dcache.net.localaddresses in compose.yaml (the image's run.sh
# starts the JVM itself, so dcache.java.options.extra would be ignored).
[core]

[core/zookeeper]

[core/pnfsmanager]
chimera.db.url = jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=${pnfsmanager.cell.name}

[core/cleaner-disk]
chimera.db.url = jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=${cleaner-disk.cell.name}

[core/poolmanager]

[core/billing]

[core/gplazma]
gplazma.configuration.file = /opt/dcache/etc/gplazma.conf
gplazma.multimap.file = /opt/dcache/etc/multimap.conf
gplazma.authzdb.file = /opt/dcache/etc/storage-authzdb
# WLCG-profile tokens from the test issuer.  Authorisation paths in their
# scopes (storage.read:/pelican) are relative to /data.
gplazma.oidc.provider!pelican = @ISSUER_URL@ -profile=wlcg -prefix=/data -suppress=audience

[core/webdav]
webdav.cell.name = webdav-tls
webdav.net.port = 2880
webdav.authn.protocol = https
webdav.authn.basic = false
webdav.authz.anonymous-operations = NONE
webdav.redirect.on-read = true
webdav.redirect.on-write = false
webdav.redirect.allow-https = true
# By default (11.2) the door answers every request from a client with 429
# for 20 seconds once it has made more than 3 failed logins within that
# window.  The tests deliberately present expired credentials, all from one
# address; a production site redirecting many clients through NAT should
# weigh the same setting.
webdav.limits.error.max-allowed = 1000

[core/pool]
pool.name = pool1
pool.path = /pool
pool.tags = hostname=localhost
pool.mover.http.port.min = 38080
pool.mover.http.port.max = 38080
pool.mover.https.port.min = 38083
pool.mover.https.port.max = 38083
