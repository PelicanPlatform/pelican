---
name: Promote Container Images

# When a semver tag is pushed, build-and-test.yml pushes the container
# images to a private repo. This workflow copies the release images for a
# given tag from there to the public repo.
#
# It also applies the floating tags (e.g., "latest" or "v26.x"; see
# .github/scripts/container-images/floating_image_tags.py) by comparing
# the given tag against the tags already in the public repo. Thus, a tag
# that is never promoted, e.g., one cut only for testing, never moves the
# floating tags.
#
# The "approve" job runs in the "image-promotion" environment, whose
# required reviewers must approve each run. The "promote" job runs in the
# "harbor-promote" environment, which holds credentials that can pull from
# the private repo and push to the public repo. (Docker keeps only one
# credential per registry host, so these must be one account.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The semver tag to promote, e.g., v26.0.0"
        required: true
        type: string

defaults:
  run:
    # bash-isms have a way of sneaking in unnoticed.
    shell: bash

permissions:
  contents: read

# Promoting two tags at once could race to update the floating tags.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Validate the tag before anyone is asked to approve it. This must be a
  # separate job, because none of a job's steps run until its environment's
  # required reviewers approve it.
  validate:
    name: Validate ${{ inputs.tag }}
    if: ${{ github.repository == 'PelicanPlatform/pelican' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Match the semver tags that build-and-test.yml runs for.
          if ! [[ ${TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Not a semver tag: ${TAG}"
            exit 1
          fi

  approve:
    name: Approve ${{ inputs.tag }}
    needs: validate
    environment: image-promotion
    runs-on: ubuntu-latest
    steps:
      - name: Record the approval
        env:
          TAG: ${{ inputs.tag }}
        run: echo "Approved the promotion of ${TAG}"

  promote:
    name: Promote ${{ inputs.tag }}
    needs: approve
    environment: harbor-promote
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_REPO: hub.osg-htc.org/pelican_private
      TARGET_REPO: hub.osg-htc.org/pelican_platform
      # Keep this in sync with RELEASE_IMAGES in build-and-test.yml.
      IMAGES: >-
        client
        cache director origin registry
        osdf-cache osdf-director osdf-origin osdf-registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to OSG Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: hub.osg-htc.org
          username: ${{ secrets.PELICAN_HARBOR_ROBOT_USER }}
          password: ${{ secrets.PELICAN_HARBOR_ROBOT_PASSWORD }}

      - name: Check that all the images exist
        run: |
          set -eu

          # Fail before copying anything, rather than promote only some of
          # the images.
          for image in ${IMAGES}; do
            docker buildx imagetools inspect "${SOURCE_REPO}/${image}:${TAG}" > /dev/null
          done

      - name: Copy images
        run: |
          set -euo pipefail

          errors="${RUNNER_TEMP}/skopeo-errors"

          for image in ${IMAGES}; do
            echo "::group::${image}"

            # skopeo reads the credentials that docker/login-action saved.
            # An image that is not in the public repo yet has no tags, and
            # Harbor reports it as "repository <project>/<image> not found".
            # Any other failure is fatal, lest the floating tags move to an
            # older release.
            if ! tags=$(skopeo list-tags "docker://${TARGET_REPO}/${image}" 2> "${errors}"); then
              if ! grep -qF "repository ${TARGET_REPO#*/}/${image} not found" "${errors}"; then
                cat "${errors}" >&2
                exit 1
              fi
              echo "Not yet in ${TARGET_REPO}"
              tags='{"Tags": []}'
            fi

            floating_tags=$(jq -r '.Tags[]' <<< "${tags}" \
              | python3 .github/scripts/container-images/floating_image_tags.py "${TAG}")
            echo "Floating tags: ${floating_tags}"

            args=(-t "${TARGET_REPO}/${image}:${TAG}")
            for floating_tag in ${floating_tags}; do
              args+=(-t "${TARGET_REPO}/${image}:${floating_tag}")
            done

            docker buildx imagetools create "${args[@]}" "${SOURCE_REPO}/${image}:${TAG}"

            echo "::endgroup::"
          done
