---
name: Run Tests (Windows)

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_call:
    inputs:
      race_detection:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: Windows (${{ matrix.binary_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary_name: pelican
            coverprofile: coverage.out
            tags: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Unlike the Linux and macOS workflows, we do not need to set up
      # Node.js, because we do not do a real build of the web UI on Windows.

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        shell: bash
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true

      - name: Pin the Go build cache
        # Point every later Go build, including those run by tests,
        # at the cache that setup-go restored.
        shell: bash
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Install gotestsum
        run: |
          if (-not (Get-Command gotestsum -ErrorAction SilentlyContinue)) {
            go install gotest.tools/gotestsum@latest
            # Ensure that ~/go/bin is in PATH for subsequent steps.
            echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run "go test"
        env:
          JUNIT_FILE: junit-${{ matrix.binary_name }}.xml
        shell: bash
        run: |
          echo "::group::Building web UI"
          make web-build
          echo "::endgroup::"
          # Start local_cache first, as on Linux and macOS.
          gotestsum \
            --format pkgname-and-test-fails \
            --hide-summary=output \
            --junitfile "$JUNIT_FILE" \
            -- \
            -p=4 \
            -timeout=${{ inputs.race_detection && '30m' || '15m' }} \
            ${{ inputs.race_detection && '-race' || '' }} \
            ${{ !inputs.race_detection && '-short' || '' }} \
            ${{ !inputs.race_detection && '-coverpkg=./...' || '' }} \
            ${{ !inputs.race_detection && '-covermode=count' || '' }} \
            ${{ !inputs.race_detection && format('-coverprofile={0}', matrix.coverprofile) || '' }} \
            -tags=${{ matrix.tags }} \
            ./local_cache \
            ./...

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-${{ matrix.binary_name }}-${{ runner.os }}
          path: junit-${{ matrix.binary_name }}.xml
          overwrite: true  # allow the workflow to be re-run, e.g., for flakey tests

      - name: Publish JUnit summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5  # v2.6
        with:
          paths: junit-${{ matrix.binary_name }}.xml

  goreleaser:
    name: Windows (GoReleaser)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs history to look up the previous tag, and so on

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true

      - name: Stub out the web UI
        # The binaries embed web_ui/frontend/out, so it must exist,
        # but nothing in this job needs the real web UI.
        run: |
          mkdir -p web_ui/frontend/out
          touch web_ui/frontend/out/index.html

      - name: Generate GoReleaser config
        run: |
          ./scripts/generate_goreleaser.sh .goreleaser.in.yml .goreleaser.generated.yml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --snapshot --skip=before --config .goreleaser.generated.yml
