---
name: Validate Parameters File

on:
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/scripts/validate-parameters/requirements.txt
          python3 -m pip install -r .github/scripts/validate-defaults/requirements.txt

      - name: Validate parameter definitions
        run: python3 .github/scripts/validate-parameters/main.py
