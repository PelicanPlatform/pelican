---
name: Validate Parameters File

on:
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/scripts/validate-parameters/requirements.txt
          python3 -m pip install -r .github/scripts/validate-defaults/requirements.txt

      - name: Validate parameter definitions
        run: python3 .github/scripts/validate-parameters/main.py
