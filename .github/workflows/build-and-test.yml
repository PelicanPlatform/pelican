---
name: Build and Test

# This workflow is responsible for building Pelican's container images
# and running the test suite.
#
# The intended behavior is that all container images are always built,
# except for the dev image, because it matters only on `main` and anything
# that might reach `main`. As for when container images are pushed:
#
#   - For pull requests: We never push images to a registry.
#     In fact, we can't, because the credentials aren't available.
#
#   - Pushes to main: We push only pelican-test and pelican-dev.
#
#   - Pushes to semver tags: We push the release and test images
#     to a private repo, and record their digests as artifacts.
#
#     The promote-images.yml workflow copies the release images,
#     by those digests, to the public repo once someone approves
#     the release.
#
# The private and public repos for each GitHub repo,
# along with the list of release images,
# are defined in .github/scripts/container-images/config.sh.

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_dispatch:

defaults:
  run:
    # bash-isms have a way of sneaking in unnoticed.
    shell: bash

permissions:
  contents: read

jobs:

  # This first job determines the work to be done:
  #
  #   - The list of images to build.
  #   - The platforms to target for those builds.
  #   - The list of images to push and where to push them.

  params:
    name: Set build parameters
    outputs:
      environment: ${{ steps.params.outputs.ENVIRONMENT }}
      images-to-build: ${{ steps.params.outputs.IMAGES_TO_BUILD }}
      images-to-push: ${{ steps.params.outputs.IMAGES }}
      platforms: ${{ steps.params.outputs.PLATFORMS }}
      registry-host: ${{ steps.params.outputs.REGISTRY_HOST }}
      registry-repo: ${{ steps.params.outputs.REGISTRY_REPO }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the container image configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/scripts/container-images
          persist-credentials: false

      - name: Determine how to build and push container images
        id: params
        run: |
          set -eu

          IS_TAG_BUILD=${{ startsWith(github.ref, 'refs/tags/') }}
          IS_MAIN_BUILD=${{ github.ref == 'refs/heads/main' }}

          # Define where this repo pushes images (PRIVATE_REPO and
          # PUBLIC_REPO), and the RELEASE_IMAGES.

          source .github/scripts/container-images/config.sh

          # Push release and test images built off of semver tags to the
          # private repo, and test and dev images built off of 'main' to
          # the public repo, if there is one. Otherwise, push nothing.

          PUSH_DEVTEST=false
          PUSH_RELEASE=false
          REGISTRY_REPO=""

          if ${IS_TAG_BUILD} && [ -n "${PRIVATE_REPO}" ]; then
            PUSH_RELEASE=true
            REGISTRY_REPO="${PRIVATE_REPO}"
          elif ${IS_MAIN_BUILD} && [ -n "${PUBLIC_REPO}" ]; then
            PUSH_DEVTEST=true
            REGISTRY_REPO="${PUBLIC_REPO}"
          fi

          # Define the other images that we know how to build,
          # grouped by the circumstances under which they are pushed.

          TEST_IMAGES=(pelican-test)
          DEV_IMAGES=(pelican-dev)

          # Define which images to push.

          IMAGES=()
          if ${PUSH_RELEASE}; then
            IMAGES+=("${RELEASE_IMAGES[@]}")
            IMAGES+=("${TEST_IMAGES[@]}")  # for testing semver tags
          fi
          if ${PUSH_DEVTEST}; then
            IMAGES+=("${TEST_IMAGES[@]}")
            IMAGES+=("${DEV_IMAGES[@]}")
          fi

          # Define the environment that holds the credentials for pushing.

          ENVIRONMENT=""
          if ${PUSH_RELEASE}; then
            ENVIRONMENT=harbor-tags
          elif ${PUSH_DEVTEST}; then
            ENVIRONMENT=harbor-main
          fi

          # Define which images to build: all of them, except the dev image
          # for semver tags, because it matters only on `main` and anything
          # that might reach `main`.

          IMAGES_TO_BUILD=("${RELEASE_IMAGES[@]}" "${TEST_IMAGES[@]}")
          if ! ${IS_TAG_BUILD}; then
            IMAGES_TO_BUILD+=("${DEV_IMAGES[@]}")
          fi

          # Turn a list of image names into a sorted, deduplicated
          # JSON list.

          to_json_list () {
            jq -cr '. | split(" ") | unique' <<< '"'"$*"'"'
          }

          IMAGES="$(to_json_list "${IMAGES[@]}")"
          IMAGES_TO_BUILD="$(to_json_list "${IMAGES_TO_BUILD[@]}")"

          # The "platforms" list forms the matrix in build-images below,
          # one job per architecture.
          # The 'id' is for when the slash in 'platform' is prohibited.

          if ${PUSH_DEVTEST} || ${PUSH_RELEASE}; then
            PLATFORMS='[
              { "arch": "amd64", "id": "linux-amd64", "platform": "linux/amd64", "runner": "ubuntu-latest" },
              { "arch": "arm64", "id": "linux-arm64", "platform": "linux/arm64", "runner": "ubuntu-24.04-arm" }
            ]'
          else
            # If we're not pushing images to a registry, then save resources.
            PLATFORMS='[
              { "arch": "amd64", "id": "linux-amd64", "platform": "linux/amd64", "runner": "ubuntu-latest" }
            ]'
          fi

          printf 'ENVIRONMENT=%s\n'          "${ENVIRONMENT}"       >> $GITHUB_OUTPUT
          printf 'IMAGES=%s\n'               "${IMAGES}"            >> $GITHUB_OUTPUT
          printf 'IMAGES_TO_BUILD=%s\n'      "${IMAGES_TO_BUILD}"   >> $GITHUB_OUTPUT
          printf 'PLATFORMS<<EOF\n%s\nEOF\n' "${PLATFORMS}"         >> $GITHUB_OUTPUT
          printf 'REGISTRY_HOST=%s\n'        "${REGISTRY_REPO%%/*}" >> $GITHUB_OUTPUT
          printf 'REGISTRY_REPO=%s\n'        "${REGISTRY_REPO}"     >> $GITHUB_OUTPUT

  tags:
    name: Set image tags
    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}
      TIMESTAMP: ${{ steps.timestamp.outputs.TIMESTAMP }}
    runs-on: ubuntu-latest
    steps:
      - name: Set timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Set the tag to use for this build
        id: tag
        run: |
          # Check for a semver tag match.
          if [[ ${GITHUB_REF##*/} =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG=${GITHUB_REF##*/}
          else
            TAG="latest-itb"
          fi

          echo "Computed tag:"
          echo $TAG
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

  # Taking inspiration from
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners,
  # we build the final, multi-architecture images in two steps:
  #
  #   1. For each architecture, use a separate runner to build
  #      all the images and push them by digest, without tags.
  #
  #   2. In a second job, for each image, create and push a manifest
  #      that encompasses all of the images from the first step.
  #
  # The first step uses `docker buildx bake` (see images/docker-bake.hcl)
  # to build all the images in one invocation.

  build-images:
    name: Build ${{ matrix.arch }} images
    needs: [params]
    environment: ${{ needs.params.outputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.params.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:

      # As of 2026-01-26, GitHub documents the Ubuntu runners as having
      # only 14 GB of storage. In practice, that is not always sufficient
      # to build XRootD and Pelican.

      - name: Free disk space
        background: true
        run: |
          # Use `df` to quickly check how much space is available.

          echo "::group::Before"
          df -h
          echo "::endgroup::"

          sudo rm -rf /usr/local/lib/android

          echo "::group::After"
          df -h
          echo "::endgroup::"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          buildkitd-flags: --debug
          cleanup: false

      - name: Log in to OSG Harbor
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ needs.params.outputs.registry-host }}
          username: ${{ secrets.PELICAN_HARBOR_PUSH_USER }}
          password: ${{ secrets.PELICAN_HARBOR_PUSH_PASSWORD }}

      - name: Build and push images
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7.5.0
        env:
          # Leave provenance out of Buildx's build-result metadata
          # (steps.bake.outputs.metadata). The next step needs only the
          # digests, and with ~11 KB per image, passing the metadata
          # through an environment variable can exceed Linux's 128 KiB
          # limit on a single variable (MAX_ARG_STRLEN).
          # This does not affect the attestations pushed with the images.
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          # Build from the checkout, not a fresh Git context,
          # because building Pelican requires the .git directory.
          source: .
          files: ./images/docker-bake.hcl
          vars: |
            IMAGES_TO_BUILD=${{ join(fromJson(needs.params.outputs.images-to-build), ',') }}
            IMAGES_TO_PUSH=${{ join(fromJson(needs.params.outputs.images-to-push), ',') }}
            REGISTRY_REPO=${{ needs.params.outputs.registry-repo }}
            PLATFORM=${{ matrix.platform }}

      - name: Export digests
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        env:
          IMAGES_TO_PUSH: ${{ needs.params.outputs.images-to-push }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -eu

          for image in $(jq -r '.[]' <<< "${IMAGES_TO_PUSH}"); do
            digest=$(jq -er --arg image "${image}" '.[$image]["containerimage.digest"]' <<< "${METADATA}")
            mkdir -p "${RUNNER_TEMP}/digests/${image}"
            touch "${RUNNER_TEMP}/digests/${image}/${digest#sha256:}"
          done

      - name: Upload digests
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.id }}
          path: ${{ runner.temp }}/digests/
          overwrite: true  # allow the workflow to be re-run
          if-no-files-found: error

  create-manifests:
    name: Create manifest
    if: ${{ needs.params.outputs.images-to-push != '[]' }}
    needs: [build-images, params, tags]
    environment: ${{ needs.params.outputs.environment }}
    strategy:
      # Let every job finish, rather than cancel ones that might have
      # pushed their immutable tags.
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.params.outputs.images-to-push) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ needs.params.outputs.registry-repo }}/${{ matrix.image }}
    steps:
      - name: Set up metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,${{ needs.tags.outputs.TAG }}
            type=raw,${{ needs.tags.outputs.TIMESTAMP }}
            type=raw,sha-{{ sha }}

      - name: Log in to OSG Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ needs.params.outputs.registry-host }}
          username: ${{ secrets.PELICAN_HARBOR_PUSH_USER }}
          password: ${{ secrets.PELICAN_HARBOR_PUSH_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Compute manifest digest
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ runner.temp }}/digests/${{ matrix.image }}
        run: |
          set -euo pipefail

          sources=()
          for digest in *; do
            sources+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          manifest=$(docker buildx imagetools create --dry-run "${sources[@]}")
          digest=$(printf '%s' "${manifest}" | sha256sum | cut -d ' ' -f 1)

          mkdir -p "${RUNNER_TEMP}/manifest-digest"
          echo "sha256:${digest}" > "${RUNNER_TEMP}/manifest-digest/digest"

      - name: Upload manifest digest
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: manifest-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/manifest-digest/
          overwrite: true  # allow the workflow to be re-run
          if-no-files-found: error

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests/${{ matrix.image }}
        env:
          TAG: ${{ needs.tags.outputs.TAG }}
          IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail

          tag_digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -er .digest
          }

          tags=$(jq -c .tags <<< "${DOCKER_METADATA_OUTPUT_JSON}")

          if ${IS_TAG_BUILD}; then
            expected_digest=$(< "${RUNNER_TEMP}/manifest-digest/digest")

            if actual_digest=$(tag_digest "${REGISTRY_IMAGE}:${TAG}" 2> /dev/null); then
              if [ "${actual_digest}" != "${expected_digest}" ]; then
                echo "::error::${REGISTRY_IMAGE}:${TAG} is ${actual_digest}, but this build's manifest is ${expected_digest}; did another run push it?"
                exit 1
              fi
              echo "An earlier attempt already pushed ${REGISTRY_IMAGE}:${TAG}"
              tags=$(jq -c --arg ref "${REGISTRY_IMAGE}:${TAG}" 'map(select(. != $ref))' <<< "${tags}")
            fi
          fi

          args=()
          for tag in $(jq -r '.[]' <<< "${tags}"); do
            args+=(-t "${tag}")
          done
          for digest in *; do
            args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

          if ${IS_TAG_BUILD}; then
            actual_digest=$(tag_digest "${REGISTRY_IMAGE}:${TAG}")
            if [ "${actual_digest}" != "${expected_digest}" ]; then
              echo "::error::${REGISTRY_IMAGE}:${TAG} is ${actual_digest}, but this build recorded ${expected_digest}"
              exit 1
            fi
          fi

  # The macOS and Windows tests do not depend on the container images being
  # built above. Thus, there are separate workflows for running those tests:
  # test-macos.yml and test-windows.yml.
  #
  # The Linux tests depend on the most recent version of the testing
  # container, which depends on whether this is a push to main, a push to
  # a semver tag, or a pull request.
  #
  # Pull requests are, in fact, handled in test-linux-pr.yml because we
  # cannot push a newer version of the testing container, so there is no
  # need to wait for it to be built.

  test:
    name: Test ${{ needs.tags.outputs.TAG }}
    needs: [create-manifests, params, tags]
    uses: ./.github/workflows/test-linux.yml
    with:
      image: ${{ needs.params.outputs.registry-repo }}/pelican-test:${{ needs.tags.outputs.TAG }}
      full_suite: ${{ github.event_name == 'push' }}
      # Semver-tag builds push the test image to a private repo.
      environment: >-
        ${{ needs.params.outputs.environment == 'harbor-tags' && 'harbor-pull' || '' }}
    # These secrets exist only in the harbor-pull environment,
    # so they are empty here.
    # Passing them by name lets the called job read the real values.
    secrets:
      PELICAN_HARBOR_PULL_USER: ${{ secrets.PELICAN_HARBOR_PULL_USER }}
      PELICAN_HARBOR_PULL_PASSWORD: ${{ secrets.PELICAN_HARBOR_PULL_PASSWORD }}
