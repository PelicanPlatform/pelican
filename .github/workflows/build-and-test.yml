---
name: Build and Test

# This workflow is responsible for building Pelican's container images and
# running the test suite.
#
# The intended behavior is that all container images are always built,
# except for the dev image, because it matters only on `main` and anything
# that might reach `main`. As for when container images are pushed:
#
#   - For pull requests: We never push images to a registry. In fact,
#     we can't, because the credentials aren't available.
#
#   - Pushes to main: We push only pelican-test and pelican-dev.
#
#   - Pushes to semver tags: We push pelican-test and all the release images.

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_dispatch:

defaults:
  run:
    # bash-isms have a way of sneaking in unnoticed.
    shell: bash

permissions:
  contents: read

jobs:

  # This first job determines the work to be done:
  #
  #   - The list of images to build.
  #   - The platforms to target for those builds.
  #   - The list of images to push and where to push them.

  params:
    name: Set build parameters
    outputs:
      # NOTE: While some of the outputs below are intended to be treated
      # as booleans, they are actually strings. In conditionals, test their
      # values using "== 'true'" or "== 'false'".
      images-to-build: ${{ steps.params.outputs.IMAGES_TO_BUILD }}
      platforms: ${{ steps.params.outputs.PLATFORMS }}
      images-to-push: ${{ steps.params.outputs.IMAGES }}
      registry-repo: ${{ steps.params.outputs.REGISTRY_REPO }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine how to build and push container images
        id: params
        env:
          # This step needs to know only whether the credentials exist.
          # Pass them through the environment rather than interpolating
          # them into the script.
          HARBOR_ROBOT_USER: ${{ secrets.PELICAN_HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_PASSWORD: ${{ secrets.PELICAN_HARBOR_ROBOT_PASSWORD }}
        run: |
          set -eu

          IS_PRIMARY_GITHUB_REPO=false
          IS_TAG_BUILD=${{ startsWith(github.ref, 'refs/tags/') }}

          case '${{ github.repository }}' in
            PelicanPlatform/pelican)
              REGISTRY_REPO="hub.opensciencegrid.org/pelican_platform"
              IS_PRIMARY_GITHUB_REPO=true ;;

            # Some testing scenarios require the ability to push container
            # images to a registry. Here, we list developers who have forked
            # the main PelicanPlatform/pelican repo and are able to push
            # images somewhere.

            brianaydemir/pelicanplatform-pelican)
              REGISTRY_REPO="hub.opensciencegrid.org/brian.aydemir.r1" ;;

            matyasselmeci/pelican)
              REGISTRY_REPO="hub.osg-htc.org/matyasosg" ;;
          esac

          # By default, assume that we are unable to push container images
          # because the credentials are not available.

          PUSH_DEVTEST=false
          PUSH_RELEASE=false

          if [ -n "${HARBOR_ROBOT_USER:-}" ] \
             && [ -n "${HARBOR_ROBOT_PASSWORD:-}" ]
          then
            if ${IS_PRIMARY_GITHUB_REPO}; then
              # For the PelicanPlatform/pelican repo, we push test and
              # dev images built off of 'main', and release images built
              # off of semver tags.
              PUSH_DEVTEST=${{ github.ref == 'refs/heads/main' }}
              PUSH_RELEASE=${IS_TAG_BUILD}
            else
              # For forks, we push only the release images.
              PUSH_DEVTEST=false
              PUSH_RELEASE=${IS_TAG_BUILD}
            fi
          fi

          # Define the images that we know how to build, grouped by the
          # circumstances under which they are pushed.

          RELEASE_IMAGES=(
            client
            cache director origin registry
            osdf-cache osdf-director osdf-origin osdf-registry
          )
          TEST_IMAGES=(pelican-test)
          DEV_IMAGES=(pelican-dev)

          # Define which images to push.

          IMAGES=()
          if ${PUSH_RELEASE}; then
            IMAGES+=("${RELEASE_IMAGES[@]}")
            IMAGES+=("${TEST_IMAGES[@]}")  # for testing semver tags
          fi
          if ${PUSH_DEVTEST}; then
            IMAGES+=("${DEV_IMAGES[@]}")
            IMAGES+=("${TEST_IMAGES[@]}")
          fi

          # Define which images to build. Start from the images that we
          # are pushing.

          IMAGES_TO_BUILD=("${IMAGES[@]}")

          # Beyond that, always build release and test images. Skip the
          # dev image for semver tags, because it matters only on `main`
          # and anything that might reach `main`.

          IMAGES_TO_BUILD+=("${RELEASE_IMAGES[@]}")
          IMAGES_TO_BUILD+=("${TEST_IMAGES[@]}")
          if ! ${IS_TAG_BUILD}; then
            IMAGES_TO_BUILD+=("${DEV_IMAGES[@]}")
          fi

          # Turn a list of image names into a sorted, deduplicated
          # JSON list.

          to_json_list () {
            jq -cr '. | split(" ") | unique' <<< '"'"$*"'"'
          }

          IMAGES="$(to_json_list "${IMAGES[@]}")"
          IMAGES_TO_BUILD="$(to_json_list "${IMAGES_TO_BUILD[@]}")"

          # The "platforms" list forms the matrix in build-images below,
          # one job per architecture.
          # The 'id' is for when the slash in 'platform' is prohibited.

          if ${PUSH_DEVTEST} || ${PUSH_RELEASE}; then
            PLATFORMS='[
              { "arch": "amd64", "id": "linux-amd64", "platform": "linux/amd64", "runner": "ubuntu-latest" },
              { "arch": "arm64", "id": "linux-arm64", "platform": "linux/arm64", "runner": "ubuntu-24.04-arm" }
            ]'
          else
            # If we're not pushing images to a registry, then save resources.
            PLATFORMS='[
              { "arch": "amd64", "id": "linux-amd64", "platform": "linux/amd64", "runner": "ubuntu-latest" }
            ]'
          fi

          printf 'PLATFORMS<<EOF\n%s\nEOF\n' "${PLATFORMS}"       >> $GITHUB_OUTPUT
          printf 'IMAGES=%s\n'               "${IMAGES}"          >> $GITHUB_OUTPUT
          printf 'IMAGES_TO_BUILD=%s\n'      "${IMAGES_TO_BUILD}" >> $GITHUB_OUTPUT
          printf 'REGISTRY_REPO=%s\n'        "${REGISTRY_REPO}"   >> $GITHUB_OUTPUT

  tags:
    name: Set image tags
    outputs:
      IS_LATEST: ${{ steps.is_latest.outputs.IS_LATEST }}
      TAG: ${{ steps.tag.outputs.TAG }}
      TIMESTAMP: ${{ steps.timestamp.outputs.TIMESTAMP }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Set whether to tag this build with "latest"
        id: is_latest
        run: |
          git fetch --tags

          highest_tag=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Current ref: ${GITHUB_REF}"
          echo "Highest release tag: ${highest_tag}"

          if [ "${GITHUB_REF##*/}" = "${highest_tag}" ]; then
            echo "IS_LATEST=true" >> $GITHUB_OUTPUT
          else
            echo "IS_LATEST=false" >> $GITHUB_OUTPUT
          fi

      - name: Set the tag to use for this build
        id: tag
        run: |
          # Check for a semver tag match.
          if [[ ${GITHUB_REF##*/} =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG=${GITHUB_REF##*/}
          else
            TAG="latest-itb"
          fi

          echo "SHA for current ref:"
          echo $(git rev-parse $GITHUB_REF_NAME)

          echo "SHA for HEAD:"
          echo $(git rev-parse HEAD)

          echo "Computed tag:"
          echo $TAG
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

  # Taking inspiration from
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners,
  # we build the final, multi-architecture images in two steps:
  #
  #   1. For each architecture, use a separate runner to build and push
  #      all the images, tagging each with its architecture.
  #
  #   2. In a second job, for each image, create and push a manifest that
  #      encompasses all of the images from the first step.
  #
  # The first step uses `docker buildx bake` (see images/docker-bake.hcl)
  # to build all the images in one invocation.

  build-images:
    name: Build ${{ matrix.arch }} images
    needs: [params, tags]
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.params.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:

      # As of 2026-01-26, GitHub documents the Ubuntu runners as having
      # only 14 GB of storage. In practice, that is not always sufficient
      # to build XRootD and Pelican.

      - name: Free disk space
        background: true
        run: |
          # Use `df` to quickly check how much space is available.

          echo "::group::Before"
          df -h
          echo "::endgroup::"

          sudo rm -rf /usr/local/lib/android

          echo "::group::After"
          df -h
          echo "::endgroup::"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          buildkitd-flags: --debug
          cleanup: false

      - name: Log in to OSG Harbor
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: hub.opensciencegrid.org
          username: ${{ secrets.PELICAN_HARBOR_ROBOT_USER }}
          password: ${{ secrets.PELICAN_HARBOR_ROBOT_PASSWORD }}

      - name: Build and push images
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f  # v7.4.0
        env:
          # Leave provenance out of Buildx's build-result metadata
          # (steps.bake.outputs.metadata). The next step needs only the
          # digests, and with ~11 KB per image, passing the metadata
          # through an environment variable can exceed Linux's 128 KiB
          # limit on a single variable (MAX_ARG_STRLEN).
          # This does not affect the attestations pushed with the images.
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          # Build from the checkout, not a fresh Git context,
          # because building Pelican requires the .git directory.
          source: .
          files: ./images/docker-bake.hcl
          vars: |
            IMAGES_TO_BUILD=${{ join(fromJson(needs.params.outputs.images-to-build), ',') }}
            IMAGES_TO_PUSH=${{ join(fromJson(needs.params.outputs.images-to-push), ',') }}
            REGISTRY_REPO=${{ needs.params.outputs.registry-repo }}
            PLATFORM=${{ matrix.platform }}
            ARCH=${{ matrix.arch }}
            GITHUB_SHA=${{ github.sha }}
            TAG=${{ needs.tags.outputs.TAG }}
            TIMESTAMP=${{ needs.tags.outputs.TIMESTAMP }}
            IS_LATEST=${{ needs.tags.outputs.IS_LATEST }}

      - name: Export digests
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        env:
          IMAGES_TO_PUSH: ${{ needs.params.outputs.images-to-push }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -eu

          for image in $(jq -r '.[]' <<< "${IMAGES_TO_PUSH}"); do
            digest=$(jq -er --arg image "${image}" '.[$image]["containerimage.digest"]' <<< "${METADATA}")
            mkdir -p "${RUNNER_TEMP}/digests/${image}"
            touch "${RUNNER_TEMP}/digests/${image}/${digest#sha256:}"
          done

      - name: Upload digests
        if: ${{ needs.params.outputs.images-to-push != '[]' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.id }}
          path: ${{ runner.temp }}/digests/
          overwrite: true  # allow the workflow to be re-run
          retention-days: 1  # we need this artifact only for the following job
          if-no-files-found: error

  create-manifests:
    name: Create manifest
    if: ${{ needs.params.outputs.images-to-push != '[]' }}
    needs: [build-images, params, tags]
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJson(needs.params.outputs.images-to-push) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ needs.params.outputs.registry-repo }}/${{ matrix.image }}
    steps:
      - name: Set up metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,${{ needs.tags.outputs.TAG }}
            type=raw,${{ needs.tags.outputs.TIMESTAMP }}
            type=raw,sha-{{ sha }}
            type=raw,enable=${{ needs.tags.outputs.IS_LATEST }},latest

      - name: Log in to OSG Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: hub.opensciencegrid.org
          username: ${{ secrets.PELICAN_HARBOR_ROBOT_USER }}
          password: ${{ secrets.PELICAN_HARBOR_ROBOT_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

  # The macOS and Windows tests do not depend on the container images being
  # built above. Thus, there are separate workflows for running those tests:
  # test-macos.yml and test-windows.yml.
  #
  # The Linux tests depend on the most recent version of the testing
  # container, which depends on whether this is a push to main, a push to
  # a semver tag, or a pull request.
  #
  # Pull requests are, in fact, handled in test-linux-pr.yml because we
  # cannot push a newer version of the testing container, so there is no
  # need to wait for it to be built.

  test:
    name: Test ${{ needs.tags.outputs.TAG }}
    needs: [create-manifests, params, tags]
    uses: ./.github/workflows/test-linux.yml
    with:
      image: ${{ needs.params.outputs.registry-repo }}/pelican-test:${{ needs.tags.outputs.TAG }}
