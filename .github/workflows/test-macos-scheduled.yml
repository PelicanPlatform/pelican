---
name: Run Tests (macOS) [on schedule]

on:
  schedule:
    - cron: "0 7 * * *"  # at 07:00 every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: Test
    uses: ./.github/workflows/test-macos.yml
    with:
      race_detection: true

  analyze-runs:
    name: Analyze Runs
    if: ${{ !cancelled() }}
    needs: [run-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # download_junit_artifacts.sh runs "gh run list" and "gh run download"
      # over the previous runs of this workflow.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/analyze-junit-results/download_junit_artifacts.sh "Run Tests (macOS) [on schedule]"

      - name: Analyze test results
        run: |
          python3 .github/scripts/analyze-junit-results/analyze_junit_results.py
          cat test-failure-analysis.md >> $GITHUB_STEP_SUMMARY
