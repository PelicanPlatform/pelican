---
name: Run Tests (macOS)

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_call:
    inputs:
      race_detection:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: macOS (${{ matrix.binary_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary_name: pelican
            coverprofile: coverage.out
            tags: client
          - binary_name: pelican-server
            coverprofile: coverage-server.out
            tags: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs history to look up the previous tag, and so on

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: "web_ui/frontend/package.json"
          check-latest: true

      # pnpm/action-setup is deliberately not used here: it bootstraps itself by
      # shelling out to "npm ci", which dies with "spawn npm ENOENT" in
      # container-based jobs, where the Actions-provided Node.js is not
      # co-located with an npm. Installing pnpm with the npm that setup-node has
      # just put on PATH sidesteps that. The version comes from the
      # "packageManager" field, so it always matches the lockfile.
      - name: Set up pnpm
        id: pnpm
        working-directory: web_ui/frontend
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          # Resolve the store path in its own assignment rather than inline in
          # the echo, so that a failure aborts the step instead of quietly
          # caching an empty path. pnpm chooses the store location based on the
          # working directory's filesystem, so resolve it where installs run.
          store="$(pnpm store path)"
          echo "store=${store}" >> "$GITHUB_OUTPUT"

      # Replaces setup-node's "cache: pnpm", which cannot be used because it
      # requires pnpm to already be installed when setup-node runs.
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Reference: https://nextjs.org/docs/pages/guides/ci-build-caching#github-actions
          # Only the Next.js build cache lives here; the pnpm store is cached
          # by the separate "Cache the pnpm store" step above.
          path: |
            ${{ github.workspace }}/web_ui/frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}-${{ hashFiles('web_ui/frontend/**/*.js', 'web_ui/frontend/**/*.jsx', 'web_ui/frontend/**/*.ts', 'web_ui/frontend/**/*.tsx', '!web_ui/frontend/**/node_modules/**') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}-

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true

      - name: Install gotestsum
        run: |
          if ! command -v gotestsum &> /dev/null; then
            go install gotest.tools/gotestsum@latest
            # Ensure that ~/go/bin is in PATH for subsequent steps.
            echo "$HOME/go/bin" >> $GITHUB_PATH
          fi

      - name: Install macOS dependencies
        run: ./github_scripts/osx_install.sh

      - name: Run "go test"
        env:
          JUNIT_FILE: junit-${{ matrix.binary_name }}.xml
        run: |
          echo "::group::Building web UI"
          make web-build
          echo "::endgroup::"
          # macOS runs the federation test suite at -p=2 (Linux uses the default
          # higher parallelism). At -p=4 the concurrent federations intermittently
          # make xrootd's loopback UDP monitor-collector connect() fail with
          # EINVAL ("Unable to setup primary monitor collector"), which is fatal
          # to xrootd startup and fails ~30% of federation launches. This is not
          # file-descriptor exhaustion (raising RLIMIT_NOFILE and kern.maxfiles
          # 13-17x had no effect) nor TIME_WAIT/ephemeral-port exhaustion (peak
          # TIME_WAIT measured at 1 with a widened range + shortened MSL); it is a
          # concurrency limit in the macOS loopback network stack / xrootd's
          # network init under CPU contention. -p=2 runs cleanly and is ~2x faster
          # than the fully-serial -p=1.
          gotestsum \
            --format pkgname-and-test-fails \
            --hide-summary=output \
            --junitfile "$JUNIT_FILE" \
            -- \
            -p=2 \
            -timeout=${{ inputs.race_detection && '45m' || '30m' }} \
            ${{ inputs.race_detection && '-race' || '' }} \
            ${{ !inputs.race_detection && '-coverpkg=./...' || '' }} \
            ${{ !inputs.race_detection && '-covermode=count' || '' }} \
            ${{ !inputs.race_detection && format('-coverprofile={0}', matrix.coverprofile) || '' }} \
            -tags=${{ matrix.tags }} \
            ./...

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-${{ matrix.binary_name }}-${{ runner.os }}
          path: junit-${{ matrix.binary_name }}.xml
          overwrite: true  # allow the workflow to be re-run, e.g., for flakey tests

      - name: Publish JUnit summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5  # v2.6
        with:
          paths: junit-${{ matrix.binary_name }}.xml

      - name: Generate GoReleaser config
        run: |
          make goreleaser-config

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --snapshot --config .goreleaser.generated.yml
