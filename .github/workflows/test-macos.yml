---
name: Run Tests (macOS)

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      # Run only for v7.0.0 and up. Include release candidates.
      - "v[7-9].[0-9]+.[0-9]+"
      - "v[7-9].[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+"
      - "v[1-9][0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  repository_dispatch:
    types:
      - dispatch-build
  workflow_call:
    inputs:
      race_detection:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      # GoReleaser always builds without cgo.
      CGO_ENABLED: ${{ inputs.race_detection && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs history to look up the previous tag, and so on

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: "web_ui/frontend/package.json"
          check-latest: true

      # pnpm/action-setup is deliberately not used here: it bootstraps itself by
      # shelling out to "npm ci", which dies with "spawn npm ENOENT" in
      # container-based jobs, where the Actions-provided Node.js is not
      # co-located with an npm. Installing pnpm with the npm that setup-node has
      # just put on PATH sidesteps that. The version comes from the
      # "packageManager" field, so it always matches the lockfile.
      - name: Set up pnpm
        id: pnpm
        working-directory: web_ui/frontend
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          # Resolve the store path in its own assignment rather than inline in
          # the echo, so that a failure aborts the step instead of quietly
          # caching an empty path. pnpm chooses the store location based on the
          # working directory's filesystem, so resolve it where installs run.
          store="$(pnpm store path)"
          echo "store=${store}" >> "$GITHUB_OUTPUT"

      # Replaces setup-node's "cache: pnpm", which cannot be used because it
      # requires pnpm to already be installed when setup-node runs.
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Reference: https://nextjs.org/docs/pages/guides/ci-build-caching#github-actions
          # Only the Next.js build cache lives here; the pnpm store is cached
          # by the separate "Cache the pnpm store" step above.
          path: |
            ${{ github.workspace }}/web_ui/frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}-${{ hashFiles('web_ui/frontend/**/*.js', 'web_ui/frontend/**/*.jsx', 'web_ui/frontend/**/*.ts', 'web_ui/frontend/**/*.tsx', '!web_ui/frontend/**/node_modules/**') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web_ui/frontend/pnpm-lock.yaml') }}-

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true

      - name: Pin the Go build cache
        # Point every later Go build, including those run by tests,
        # at the cache that setup-go restored.
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Install gotestsum
        run: |
          if ! command -v gotestsum &> /dev/null; then
            go install gotest.tools/gotestsum@latest
            # Ensure that GOPATH/bin is in PATH for subsequent steps.
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Install macOS dependencies
        run: ./github_scripts/osx_install.sh

      - name: Check which packages depend on the build tags
        id: tags
        # List the packages to test again with -tags=server. The script
        # explains why the others can be skipped, and fails if they can't.
        run: |
          packages=$(./.github/scripts/go-test/build_tag_packages.sh)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        run: make web-build

      - name: Generate GoReleaser config
        run: |
          ./scripts/generate_goreleaser.sh .goreleaser.in.yml .goreleaser.generated.yml

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --snapshot --skip=before --config .goreleaser.generated.yml --id pelican --id pelican-server

      - name: Point the tests at the GoReleaser binaries
        id: binaries
        # See test_utils/binaries.go. The script fails if dist/artifacts.json
        # lacks any binary named here.
        run: |
          ./.github/scripts/go-test/goreleaser_binaries.sh \
            TEST_PELICAN_BINARY TEST_PELICAN_SERVER_BINARY |
            tee -a "$GITHUB_ENV"

      - name: Run "go test" on shared and client-specific code
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          # e2e_fed_tests and local_cache take longest, so start them first.
          #
          # At -p=4, concurrent federations intermittently break xrootd
          # startup ("Unable to setup primary monitor collector").
          # This is due to a concurrency limit in the macOS loopback network
          # stack / xrootd's network init under CPU contention.
          gotestsum \
            --format pkgname-and-test-fails \
            --hide-summary=output \
            --junitfile junit-client.xml \
            -- \
            -p=2 \
            -timeout=${{ inputs.race_detection && '45m' || '30m' }} \
            ${{ inputs.race_detection && '-race' || '' }} \
            -tags=client \
            ./e2e_fed_tests \
            ./local_cache \
            ./...

      - name: Run "go test" on server-specific code
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        env:
          PACKAGES: ${{ steps.tags.outputs.packages }}
        run: |
          # The check step found that only these packages differ from the
          # client run above.
          # shellcheck disable=SC2086  # PACKAGES is a list
          gotestsum \
            --format pkgname-and-test-fails \
            --hide-summary=output \
            --junitfile junit-server.xml \
            -- \
            -p=2 \
            -timeout=${{ inputs.race_detection && '45m' || '30m' }} \
            ${{ inputs.race_detection && '-race' || '' }} \
            -tags=server \
            $PACKAGES

      - name: Upload the JUnit report for shared and client-specific code
        if: ${{ always() && hashFiles('junit-client.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-pelican-${{ runner.os }}
          path: junit-client.xml
          overwrite: true  # allow the workflow to be re-run, e.g., for flakey tests

      - name: Upload the JUnit report for server-specific code
        if: ${{ always() && hashFiles('junit-server.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-pelican-server-${{ runner.os }}
          path: junit-server.xml
          overwrite: true  # allow the workflow to be re-run, e.g., for flakey tests

      - name: Summarize "go test" on shared and client-specific code
        if: ${{ always() && hashFiles('junit-client.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5  # v2.6
        with:
          paths: junit-client.xml
          output: summary-client.md

      - name: Summarize "go test" on server-specific code
        if: ${{ always() && hashFiles('junit-server.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5  # v2.6
        with:
          paths: junit-server.xml
          output: summary-server.md

      - name: Publish the test summaries
        if: always()
        run: |
          # test-summary/action has no title input, so head each run's
          # summary with the name of the step that ran the tests.
          publish() {
            printf '### Run "go test" on %s\n\n' "$1"
            if [ -f "$2" ]; then cat "$2"; else echo "No test results."; fi
            printf '\n\n'
          }
          {
            publish "shared and client-specific code" summary-client.md
            publish "server-specific code" summary-server.md
          } >> "$GITHUB_STEP_SUMMARY"
