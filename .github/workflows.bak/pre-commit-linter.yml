---
name: Linter

on:
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.*"
  pull_request:
  workflow_dispatch:

jobs:
  go-linter:
    name: Go (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the canonical configuration, and the only one that
          # runs the whole-program "unused" linter: on the cross legs,
          # a symbol's only callers often sit in files that GOOS excludes,
          # so every finding there would be an artifact of the split.
          - goos: linux
            args: --config=.golangci.yaml
          - goos: darwin
            args: --config=.golangci.yaml --disable=unused
          - goos: windows
            args: --config=.golangci.yaml --disable=unused
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Go version
        # Determine the string to use in setup-go's "go-version" input.
        id: go-version
        run: |
          version=$(grep -E '^go[[:space:]]*[0-9]+\.[0-9]+' go.mod | grep -oE '[0-9]+\.[0-9]+')
          echo "version=${version}.x" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true
          cache: false

      # Python is needed only by the pre-commit step below, which we run
      # only on Linux.
      - name: Set up Python
        if: matrix.goos == 'linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # Run the Go linters here so that issues are called out inline, and
      # because pre-commit (below) isn't configured to run them within the
      # CI actions.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12.2
          args: ${{ matrix.args }}
          # The action's cache key uses the runner's OS, not GOOS, and
          # every leg runs on Linux. golangci-lint's own cache entries are
          # content-addressed, so they are safe to load on any OS.
          # In order to make the action's cache deterministic, we make
          # GOOS=linux the canonical writer.
          skip-save-cache: ${{ matrix.goos != 'linux' }}

      # Run the pre-commit hooks only on Linux because they are
      # platform-independent; running them on all platforms simply
      # wastes resources.
      - name: Run pre-commit
        if: matrix.goos == 'linux'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  web-linter:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "web_ui/frontend/package.json"
          cache: "npm"
          cache-dependency-path: "web_ui/frontend/package-lock.json"
          check-latest: true

      - name: Run Prettier
        run: |
          cd web_ui/frontend
          npm ci
          npm run format
