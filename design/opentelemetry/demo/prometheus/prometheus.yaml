# Two sources of metrics:
#  - span metrics, pushed by the collector to the OTLP receiver
#    (--web.enable-otlp-receiver, http://prometheus:9090/api/v1/otlp);
#  - each Pelican server's own /metrics, scraped below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  keep_identifying_resource_attributes: true
  # Resource attributes that become labels on every OTLP series.
  promote_resource_attributes:
    - service.name
    - service.version
    - service.instance.id
    - host.name

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  # Monitoring.MetricAuthorization is false on the demo servers, so /metrics
  # needs no token.  The servers use self-signed certificates.
  - job_name: pelican
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["director:8444"]
        labels:
          pelican_server: director
      - targets: ["origin:8444"]
        labels:
          pelican_server: origin
      - targets: ["cache:8444"]
        labels:
          pelican_server: cache
