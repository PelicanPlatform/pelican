# Grafana for the Pelican tracing demo: anonymous access, served at the root
# path (there is no front proxy), home page is the Pelican dashboard.
# compose.yaml sets root_url from GRAFANA_PORT.

[paths]
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = localhost

[users]
default_theme = system
home_page = /d/pelican-downloads/pelican-object-downloads
# Grafana 13 gives anonymous users the Viewer role whatever org_role says;
# this lets them use Explore (trace search, trace-to-logs).
viewers_can_edit = true

[auth]
disable_login_form = true

[auth.anonymous]
enabled = true
org_name = Main Org.
# The upstream demo asks for Admin; Grafana 13 ignores that and logs that
# only Viewer is supported, so say Viewer (see viewers_can_edit above).
org_role = Viewer

[plugins]
# Grafana 13 otherwise downloads newer versions of its bundled plugins at
# every start.
preinstall_auto_update = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
