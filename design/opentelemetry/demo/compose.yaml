# Pelican tracing demo: a Go-native federation (director+registry, posixv2
# origin, Cache.EnableV2 cache), an exerciser that downloads objects through
# it, and an OpenTelemetry observability stack modelled on the upstream
# OpenTelemetry demo.  Traces are collected centrally; logs are not, so each
# Pelican service keeps its own (`make trace-logs id=<trace id>`).
#
#   make build up        # or: docker compose up -d --build
#
# See README.md, section 6, for what to look at.

x-default-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

# Every Pelican service runs the same image, built from this repository.
# Only `director` carries the build; the others reuse the image it tags
# (`docker compose build` or `up --build` builds it first).
x-pelican-build: &pelican-build
  context: ../../..
  dockerfile: design/opentelemetry/demo/Dockerfile
  args:
    PELICAN_VERSION: ${PELICAN_VERSION}
    GO_IMAGE: ${GO_IMAGE}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE}

x-pelican-healthcheck: &pelican-healthcheck
  test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://localhost:8444/api/v1.0/health"]
  start_period: 60s
  start_interval: 2s
  interval: 10s
  timeout: 5s
  retries: 5

services:
  # --------------------------------------------------------------------------
  # Federation
  # --------------------------------------------------------------------------

  director:
    image: ${PELICAN_IMAGE}
    build: *pelican-build
    hostname: director
    command: ["serve", "--module", "director,registry", "--config", "/etc/pelican-demo/pelican.yaml"]
    volumes:
      - ./pelican/director.yaml:/etc/pelican-demo/pelican.yaml:ro
      - director-config:/etc/pelican
      - director-state:/var/lib/pelican
      - pelican-logs:/var/log/pelican
    ports:
      - "${DIRECTOR_PORT}:8444"
    healthcheck: *pelican-healthcheck
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    logging: *logging

  origin:
    image: ${PELICAN_IMAGE}
    pull_policy: never
    hostname: origin
    command: ["origin", "serve", "--config", "/etc/pelican-demo/pelican.yaml"]
    volumes:
      - ./pelican/origin.yaml:/etc/pelican-demo/pelican.yaml:ro
      - origin-config:/etc/pelican
      - origin-state:/var/lib/pelican
      - demo-data:/data/demo
      - pelican-logs:/var/log/pelican
    depends_on:
      director:
        condition: service_healthy
    healthcheck: *pelican-healthcheck
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    logging: *logging

  cache:
    image: ${PELICAN_IMAGE}
    pull_policy: never
    hostname: cache
    command: ["cache", "serve", "--config", "/etc/pelican-demo/pelican.yaml"]
    volumes:
      - ./pelican/cache.yaml:/etc/pelican-demo/pelican.yaml:ro
      - cache-config:/etc/pelican
      - cache-state:/var/lib/pelican
      - pelican-logs:/var/log/pelican
    depends_on:
      director:
        condition: service_healthy
      origin:
        condition: service_healthy
    healthcheck: *pelican-healthcheck
    deploy:
      resources:
        limits:
          memory: 600M
    restart: unless-stopped
    logging: *logging

  exerciser:
    image: ${PELICAN_IMAGE}
    pull_policy: never
    entrypoint: ["/bin/sh", "/exerciser/exerciser.sh"]
    environment:
      # No endpoint: each client learns it from the director.
      - PELICAN_TRACING_ENABLED=true
      - PELICAN_TLSSKIPVERIFY=true
      - EXERCISER_FEDERATION=pelican://director:8444
      - EXERCISER_NAMESPACE=/demo
      - EXERCISER_DATA_DIR=/data/demo
      - EXERCISER_CLIENT_LOG=/var/log/pelican/client.log
      - EXERCISER_INTERVAL
      - EXERCISER_WEIGHT_HIT
      - EXERCISER_WEIGHT_MISS
      - EXERCISER_WEIGHT_LARGE
      - EXERCISER_WEIGHT_SHARED
      - EXERCISER_WEIGHT_DIRECT
      - EXERCISER_WEIGHT_MISSING
      - EXERCISER_HIT_OBJECTS
      - EXERCISER_SMALL_SIZE_KB
      - EXERCISER_LARGE_SIZE_MB
      - EXERCISER_SHARED_SIZE_MB
      - EXERCISER_SHARED_CLIENTS
      - EXERCISER_RETAIN_MINUTES
      - EXERCISER_DEBUG
    volumes:
      - ./exerciser:/exerciser:ro
      - demo-data:/data/demo
      - pelican-logs:/var/log/pelican
    tmpfs:
      # Downloads land here and are deleted after each run.
      - /tmp/exerciser:size=512m
    depends_on:
      cache:
        condition: service_healthy
      origin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    restart: unless-stopped
    logging: *logging

  # --------------------------------------------------------------------------
  # Observability
  # --------------------------------------------------------------------------

  otel-collector:
    image: ${COLLECTOR_CONTRIB_IMAGE}
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - GOMEMLIMIT=320MiB
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    logging: *logging

  jaeger:
    image: ${JAEGERTRACING_IMAGE}
    command: ["--config=file:/etc/jaeger/config.yaml"]
    environment:
      - MEMORY_MAX_TRACES=20000
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "${JAEGER_UI_PORT}:16686"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    logging: *logging

  grafana:
    image: ${GRAFANA_IMAGE}
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT}/
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    logging: *logging

volumes:
  director-config:
  director-state:
  origin-config:
  origin-state:
  cache-config:
  cache-state:
  demo-data:
  # Each service's log file.  The services share one volume only so that
  # `make pelican-logs` can follow them all; nothing collects from it.
  pelican-logs:
  grafana-data:

networks:
  default:
    name: pelican-otel-demo
    driver: bridge
